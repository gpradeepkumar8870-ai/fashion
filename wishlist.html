{% extends "base.html" %}
{% block title %}My Wishlist - StyleHub{% endblock %}
{% block content %}
<div class="container py-4">
  <h3 class="fw-bold mb-4">My Wishlist</h3>
  <div class="row" id="sh-wishlist-root">
    <div class="col-12 text-center py-5"><div class="spinner-border" style="color:var(--sh-primary);"></div></div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script src="/static/js/products.js?v=2"></script>
<script>
async function loadWishlist() {
  if (!SH.requireAuthOrRedirect("/wishlist")) return;
  const root = document.getElementById("sh-wishlist-root");
  try {
    const wishlist = await SH.api("/api/wishlist");
    if (wishlist.length === 0) {
      root.innerHTML = `
        <div class="col-12 sh-empty-state">
          <i class="bi bi-heart fs-1"></i>
          <p class="mt-3">Your wishlist is empty.</p>
          <a href="/products" class="btn btn-sh-primary">Discover Products</a>
        </div>`;
      return;
    }
    root.innerHTML = wishlist.map(w => shRenderProductCard(w.product)).join("");
    shBindWishlistButtons(root);
    // all items here are already wishlisted -> mark active immediately
    root.querySelectorAll(".sh-wishlist-btn").forEach(btn => {
      btn.classList.add("active");
      btn.querySelector("i").className = "bi bi-heart-fill";
    });
  } catch (e) {
    root.innerHTML = `<div class="col-12 sh-empty-state">Could not load your wishlist.</div>`;
  }
}
loadWishlist();
</script>
{% endblock %}
