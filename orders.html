{% extends "base.html" %}
{% block title %}My Orders - StyleHub{% endblock %}
{% block content %}
<div class="container py-4">
  <h3 class="fw-bold mb-4">My Orders</h3>
  <div id="sh-orders-root">
    <div class="text-center py-5"><div class="spinner-border" style="color:var(--sh-primary);"></div></div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
async function loadOrders() {
  if (!SH.requireAuthOrRedirect("/orders")) return;
  const root = document.getElementById("sh-orders-root");
  try {
    const orders = await SH.api("/api/orders");
    if (orders.length === 0) {
      root.innerHTML = `
        <div class="sh-empty-state">
          <i class="bi bi-receipt fs-1"></i>
          <p class="mt-3">You haven't placed any orders yet.</p>
          <a href="/products" class="btn btn-sh-primary">Start Shopping</a>
        </div>`;
      return;
    }
    root.innerHTML = orders.map(order => `
      <a href="/orders/${order.order_number}" class="text-decoration-none text-dark">
        <div class="sh-filter-box mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
          <div>
            <strong>${order.order_number}</strong>
            <div class="small text-muted">Placed on ${new Date(order.created_at).toLocaleDateString("en-IN", { year: "numeric", month: "long", day: "numeric" })}</div>
            <div class="small text-muted">${order.items.length} item(s) &middot; ${SH.fmtPrice(order.total_amount)}</div>
          </div>
          <span class="sh-status-badge status-${order.order_status}">${order.order_status}</span>
        </div>
      </a>
    `).join("");
  } catch (e) {
    root.innerHTML = `<div class="sh-empty-state">Could not load orders.</div>`;
  }
}
loadOrders();
</script>
{% endblock %}
